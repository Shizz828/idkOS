[env:cardputer-adv]
platform = espressif32@7.1.3
board = m5stack-stamps3
framework = arduino
extra_scripts = pre:scripts/build_watchlist.py
monitor_speed = 115200
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
    bblanchon/ArduinoJson@6.21.6
    ewpa/LibSSH-ESP32@5.10.0
board_build.embed_files = data/cert/x509_crt_bundle.bin
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; Keep the builder's home/project paths out of __FILE__ strings and ELF debug info.
    -fmacro-prefix-map=${platformio.packages_dir}/=
    -fmacro-prefix-map=$PROJECT_DIR/=
    -fdebug-prefix-map=${platformio.packages_dir}/=
    -fdebug-prefix-map=$PROJECT_DIR=.
